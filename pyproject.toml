[project]
name = "number-words-lib"
version = "0.1.0"
description = "Converts integers in the range -999999999 to 999999999 into their English word equivalents."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
